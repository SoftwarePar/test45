<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DS Parts Keyboard Test</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui;padding:24px}h1{font-size:26px}p{color:#aaa;line-height:1.5}input,textarea{width:100%;box-sizing:border-box;margin:12px 0;padding:16px;font-size:20px;background:#111;color:#fff;border:1px solid #444;border-radius:12px}pre{white-space:pre-wrap;background:#111;border:1px solid #333;border-radius:12px;padding:12px;font-size:12px;min-height:180px}</style></head><body><h1>Prueba de teclado DS Parts</h1><p>Esta página no carga el sistema, la base, buscadores ni scripts del panel. Es un campo HTML nativo para verificar exactamente qué envía Android/Gboard al tocar borrar.</p><input id="t" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribí ACEITE y borrá"><textarea id="ta" rows="3" placeholder="Probá también acá"></textarea><pre id="log">Eventos aparecerán aquí…</pre><script>const log=document.getElementById('log');let lines=[];function add(s){lines.unshift(new Date().toLocaleTimeString()+'  '+s);log.textContent=lines.slice(0,30).join('\n')}for(const id of ['t','ta']){const el=document.getElementById(id);['keydown','beforeinput','input','compositionstart','compositionupdate','compositionend'].forEach(type=>el.addEventListener(type,e=>{add(id+' '+type+' key='+(e.key??'')+' inputType='+(e.inputType??'')+' data='+(e.data??'')+' value="'+el.value+'" composing='+(e.isComposing??false))}))}</script></body></html>
